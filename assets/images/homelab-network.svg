<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Mono', 'Consolas', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="760" height="500" rx="10" fill="#0f1117"/>

  <!-- Title bar -->
  <rect width="760" height="38" rx="10" fill="#0f1117"/>
  <rect y="28" width="760" height="10" fill="#0f1117"/>
  <rect x="1" y="1" width="758" height="36" rx="9" fill="#161b22" stroke="#1e2230" stroke-width="0.5"/>
  <circle cx="20" cy="19" r="5.5" fill="#ff5f56"/>
  <circle cx="38" cy="19" r="5.5" fill="#ffbd2e"/>
  <circle cx="56" cy="19" r="5.5" fill="#27c93f"/>
  <text x="380" y="23" text-anchor="middle" font-size="10" fill="#4a5568" letter-spacing="0.08em">rubberduck.log — homelab network architecture</text>

  <!-- Zone LAN -->
  <rect x="148" y="58" width="196" height="108" rx="6" fill="#0a1a0d" stroke="#1a3a1f" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="246" y="73" text-anchor="middle" font-size="9" fill="#2d6a35" letter-spacing="0.1em">LAN — 192.168.1.x</text>

  <!-- Zone DMZ -->
  <rect x="412" y="58" width="316" height="348" rx="6" fill="#0d0d1a" stroke="#1a1a3a" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="570" y="73" text-anchor="middle" font-size="9" fill="#2d2d6a" letter-spacing="0.1em">DMZ — 192.168.10.x</text>

  <!-- Livebox -->
  <rect x="28" y="82" width="108" height="56" rx="4" fill="#111318" stroke="#2a2e3a" stroke-width="0.5"/>
  <text x="82" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#6ee7b7">Livebox</text>
  <text x="82" y="124" text-anchor="middle" font-size="9" fill="#4a5568">192.168.1.1</text>

  <!-- NAS DS923+ -->
  <rect x="160" y="76" width="172" height="78" rx="4" fill="#111318" stroke="#22543d" stroke-width="1"/>
  <text x="246" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#4ade80">NAS DS923+</text>
  <text x="246" y="118" text-anchor="middle" font-size="9" fill="#2d6a35">ovs_eth0 → 192.168.1.20</text>
  <text x="246" y="133" text-anchor="middle" font-size="9" fill="#2d6a35">ovs_eth1 → 192.168.10.21</text>

  <!-- BlackWall -->
  <rect x="424" y="80" width="292" height="60" rx="4" fill="#111318" stroke="#312e81" stroke-width="1"/>
  <text x="570" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#818cf8">BlackWall</text>
  <text x="570" y="124" text-anchor="middle" font-size="9" fill="#4b5563">Debian 13 · eno1 · 192.168.10.50</text>

  <!-- Docker zone -->
  <rect x="424" y="162" width="292" height="168" rx="4" fill="#0d0d1a" stroke="#1e1b4b" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="570" y="178" text-anchor="middle" font-size="9" fill="#312e81" letter-spacing="0.08em">docker containers</text>

  <!-- Harbor -->
  <rect x="434" y="186" width="124" height="48" rx="3" fill="#111318" stroke="#312e81" stroke-width="0.5"/>
  <text x="496" y="207" text-anchor="middle" font-size="11" font-weight="500" fill="#818cf8">Harbor</text>
  <text x="496" y="224" text-anchor="middle" font-size="9" fill="#4b5563">registry + Trivy</text>

  <!-- Portainer -->
  <rect x="582" y="186" width="124" height="48" rx="3" fill="#111318" stroke="#312e81" stroke-width="0.5"/>
  <text x="644" y="207" text-anchor="middle" font-size="11" font-weight="500" fill="#818cf8">Portainer</text>
  <text x="644" y="224" text-anchor="middle" font-size="9" fill="#4b5563">mgmt UI</text>

  <!-- Services -->
  <rect x="434" y="252" width="272" height="48" rx="3" fill="#111318" stroke="#1e1b4b" stroke-width="0.5"/>
  <text x="570" y="273" text-anchor="middle" font-size="11" font-weight="500" fill="#4b5563">autres services</text>
  <text x="570" y="290" text-anchor="middle" font-size="9" fill="#374151">WoL · monitoring · ...</text>

  <!-- LVM -->
  <rect x="424" y="352" width="292" height="46" rx="4" fill="#111318" stroke="#374151" stroke-width="0.5"/>
  <text x="570" y="372" text-anchor="middle" font-size="11" font-weight="500" fill="#9ca3af">LVM vg_data</text>
  <text x="570" y="388" text-anchor="middle" font-size="9" fill="#4b5563">/var/lib/docker · /dev/sdb</text>

  <!-- iptables note -->
  <rect x="28" y="240" width="276" height="74" rx="4" fill="#111318" stroke="#374151" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="166" y="260" text-anchor="middle" font-size="9" fill="#6b7280">$ iptables -A FORWARD -i ovs_eth1 \</text>
  <text x="166" y="275" text-anchor="middle" font-size="9" fill="#6b7280">  -o ovs_eth0 -j ACCEPT</text>
  <text x="166" y="290" text-anchor="middle" font-size="9" fill="#6b7280">$ iptables -t nat -A POSTROUTING \</text>
  <text x="166" y="305" text-anchor="middle" font-size="9" fill="#374151">  -o ovs_eth0 -j MASQUERADE</text>

  <!-- iptables label -->
  <text x="166" y="330" text-anchor="middle" font-size="8" fill="#374151" letter-spacing="0.05em">↻ script planifié au démarrage</text>

  <!-- Isolation note -->
  <rect x="28" y="360" width="276" height="46" rx="4" fill="#111318" stroke="#374151" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="166" y="380" text-anchor="middle" font-size="9" fill="#6b7280">isolation DMZ</text>
  <text x="166" y="396" text-anchor="middle" font-size="9" fill="#374151">compromission → 192.168.10.x only</text>

  <!-- ARROWS -->
  <!-- Livebox ↔ NAS LAN1 -->
  <line x1="136" y1="110" x2="158" y2="110" stroke="#22543d" stroke-width="1" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="147" y="103" text-anchor="middle" font-size="8" fill="#22543d">LAN1</text>

  <!-- NAS ↔ BlackWall LAN2 + NAT -->
  <line x1="332" y1="110" x2="422" y2="110" stroke="#4ade80" stroke-width="1.2" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="377" y="103" text-anchor="middle" font-size="8" fill="#4ade80">LAN2 · NAT</text>
  <text x="377" y="128" text-anchor="middle" font-size="8" fill="#374151">gw: 192.168.10.21</text>

  <!-- BlackWall → Docker -->
  <line x1="570" y1="140" x2="570" y2="160" stroke="#312e81" stroke-width="0.8" marker-end="url(#arr)"/>

  <!-- Docker → LVM -->
  <line x1="570" y1="330" x2="570" y2="350" stroke="#374151" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#arr)"/>

  <!-- NAS → iptables (L-bend) -->
  <path d="M246 154 L246 210 L30 210 L30 238" fill="none" stroke="#374151" stroke-width="0.5" stroke-dasharray="3 2" marker-end="url(#arr)"/>

  <!-- NAS → isolation note -->
  <path d="M200 154 L200 220 L28 220 L28 358" fill="none" stroke="#1f2937" stroke-width="0.5" stroke-dasharray="3 2" marker-end="url(#arr)"/>

  <!-- Footer -->
  <text x="380" y="478" text-anchor="middle" font-size="9" fill="#1f2937">RubberDucking35 · Bretagne · 2026</text>
</svg>
